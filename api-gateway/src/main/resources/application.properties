spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# JWT (must match auth-service)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Spring Cloud Gateway routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=expense-service
spring.cloud.gateway.routes[1].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/expenses/**

spring.cloud.gateway.routes[2].id=report-service
spring.cloud.gateway.routes[2].uri=lb://report-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/reports/**

spring.cloud.gateway.routes[3].id=category-service
spring.cloud.gateway.routes[3].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/categories/**

spring.cloud.gateway.routes[4].id=budget-service
spring.cloud.gateway.routes[4].uri=lb://EXPENSE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/budget/**

# Actuator
management.endpoints.web.exposure.include=health,gateway

